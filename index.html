<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>75專用角色卡備份小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
:root{
  --bg:#ECEFF0; --surface:#FFFFFF; --surface-2:#F5F7F7; --ink:#1B2226; --muted:#5C696F;
  --line:#D4DBDD; --line-2:#E4E9EA; --accent:#1F6F6B; --accent-ink:#FFFFFF; --accent-soft:#DCECEA;
  --warn:#9A5B14; --warn-soft:#F6EAD9; --err:#B3261E; --err-soft:#F7E1DF; --ok:#2E7D4F; --ok-soft:#DFF0E5;
  --shadow:0 1px 2px rgba(20,40,45,.06),0 4px 16px rgba(20,40,45,.05);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111719; --surface:#192124; --surface-2:#1F282B; --ink:#E3E9EA; --muted:#94A3A8;
  --line:#2D393D; --line-2:#253033; --accent:#62B9B2; --accent-ink:#0D1B1A; --accent-soft:#1C3532;
  --warn:#E3A45C; --warn-soft:#3A2E1E; --err:#F08A80; --err-soft:#3D2220; --ok:#7CC897; --ok-soft:#1D3325;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111719; --surface:#192124; --surface-2:#1F282B; --ink:#E3E9EA; --muted:#94A3A8;
  --line:#2D393D; --line-2:#253033; --accent:#62B9B2; --accent-ink:#0D1B1A; --accent-soft:#1C3532;
  --warn:#E3A45C; --warn-soft:#3A2E1E; --err:#F08A80; --err-soft:#3D2220; --ok:#7CC897; --ok-soft:#1D3325;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--f-disp);font-size:18px;margin:0;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-actions .wide{grid-column:1/-1}
.sec-label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.card-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.card-list button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:0}
.card-list button:hover{background:var(--surface-2)}
.card-list button[aria-current="true"]{background:var(--accent-soft)}
.card-list .nm{font-family:var(--f-disp);font-size:15px;font-weight:600}
.card-list .meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-note{font-size:12px;color:var(--muted);margin-top:auto;border-top:1px solid var(--line-2);padding-top:12px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);color:var(--surface);border-color:var(--err)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* main */
.main{padding-block:24px 64px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-family:var(--f-disp);font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);white-space:nowrap;font-size:13.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;background:var(--err-soft);color:var(--err);font-variant-numeric:tabular-nums}
.tabs .badge.ok{background:var(--ok-soft);color:var(--ok)}
.file-cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 10px}

/* fields */
.fields{display:flex;flex-direction:column;gap:16px;max-width:900px}
.field{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px 12px}
.field-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);font-weight:500}
.tag .req{color:var(--err)}
.tag .opt{color:var(--muted);font-weight:400}
.hint{font-size:12px;color:var(--muted)}
.count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.field input[type=text],.field textarea,.field select,.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 10px;line-height:1.65}
.field textarea{resize:vertical;min-height:64px;font-size:13.5px;tab-size:2}
.field textarea.big{min-height:180px}
.field input:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row2 .field{margin:0}

/* list items (events/stories) */
.items{display:flex;flex-direction:column;gap:14px;max-width:900px}
.item{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px}
.item-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.fname{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 7px;color:var(--muted)}
.item-head .sp{flex:1}
.item .grid{display:grid;grid-template-columns:200px 1fr;gap:10px;margin-bottom:8px}
.item label{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-bottom:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;max-width:900px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.empty{color:var(--muted);font-size:13px;padding:24px;border:1px dashed var(--line);border-radius:10px;text-align:center;max-width:900px}

/* draft */
.draft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.draft-left textarea{min-height:60vh}
.dock{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.dock .panel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dock select,.dock .inp{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:6px 8px;width:100%}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sel-info{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.target-preview textarea{min-height:220px}

/* check */
.checks{display:flex;flex-direction:column;gap:8px;max-width:900px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pill{border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.issue{display:grid;grid-template-columns:4px 1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;align-items:center}
.issue .bar{align-self:stretch}
.issue.err .bar{background:var(--err)} .issue.warn .bar{background:var(--warn)} .issue.info .bar{background:var(--line)}
.issue .body{padding:9px 0}
.issue .t{font-size:13.5px}
.issue .w{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.issue .go{margin-right:10px}
code,.mono{font-family:var(--f-mono);font-size:.92em}
.q{background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;font-family:var(--f-mono);font-size:12px}

/* preview */
.pv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.pv-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.pv-list button{text-align:left;background:none;border:0;border-radius:6px;padding:5px 10px;font-family:var(--f-mono);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.pv-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.pv-list .sz{color:var(--muted);font-size:11px}
.pv-body{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;min-width:0}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);font-family:var(--f-mono);font-size:12.5px}
.pv-body pre{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;max-height:70vh;overflow:auto}

/* modal-ish panel */
.sheet{position:fixed;inset:0;background:rgba(10,20,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;z-index:20}
.sheet .box{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--f-disp);font-size:19px}
.sheet label{font-size:12.5px;color:var(--muted)}
.sheet .inp,.sheet select{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 10px;width:100%}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px}
.sheet p{margin:0;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.mobile-bar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px}
  .side .card-list,.side .sec-label.lib,.side-note{display:none}
  .mobile-bar{display:block}
  .mobile-bar select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px}
  .row2,.draft,.pv{grid-template-columns:1fr}
  .item .grid{grid-template-columns:1fr}
  .dock{position:static}
  .pv-list{position:static;flex-direction:row;flex-wrap:wrap}
  .head h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><h1>75專用角色卡備份小幫手</h1></div>
    <div class="side-actions">
      <button class="btn primary wide" id="btnNew" type="button">＋ 新增角色</button>
      <button class="btn" id="btnImport" type="button">匯入 zip／txt</button>
      <button class="btn" id="btnExportAll" type="button">全部匯出</button>
      <input type="file" id="fileImport" accept=".zip,.txt" multiple hidden>
    </div>
    <div class="mobile-bar"><select id="mobileSel" aria-label="切換角色"></select></div>
    <div class="sec-label lib">角色庫</div>
    <ul class="card-list" id="cardList"></ul>
    <div class="side-note">資料只存在這個瀏覽器裡，不會上傳。清除瀏覽器資料就會消失，完成後記得「全部匯出」備份。</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script id="core">
/* ===== CORE: format model, parse, serialize, checks (no DOM) ===== */
var CORE = (function(){
  var EXTRA_N = 10;
  function blankCard(name){
    var x=[]; for(var i=0;i<EXTRA_N;i++) x.push('');
    return {id:uid(), name:name||'未命名',
      p:{name:name||'',age:'',job:'',quote:'',desc:'',note:''},
      b:{gender:'',info:'',persona:'',speech:''},
      d:{likes:'',dislikes:'',bday:'',x:x},
      o:{script:'',dialog:''},
      stories:[], events:[], draft:'', unknown:[]};
  }
  function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}

  // header label -> [fileType, key, style]; style: 'inline' (value after " *") or 'block'
  var FILES = {
    '個人資料':[['姓名','p.name','inline','*'],['年齡','p.age','inline','*'],['職業','p.job','inline','*'],['來自角色的一句話','p.quote','inline','*'],['敘述','p.desc','block','opt'],['創作者筆記','p.note','block','opt']],
    '基本設定':[['性別','b.gender','block',''],['基本資訊','b.info','block','*'],['性格','b.persona','block','*'],['說話風格與習慣','b.speech','block','*']],
    '詳細設定':[['喜歡','d.likes','block','opt'],['不喜歡','d.dislikes','block','opt'],['生日','d.bday','block','opt']],
    '首場':[['情境腳本','o.script','block','opt'],['角色對話','o.dialog','block','opt']]
  };
  var ALLOWED = {
    '個人資料':['姓名','年齡','職業','來自角色的一句話','敘述','創作者筆記'],
    '基本設定':['性別','基本資訊','性格','說話風格與習慣'],
    '詳細設定':['喜歡','不喜歡','生日','附加資訊'],
    '首場':['情境腳本','角色對話'],
    '故事':['解鎖故事時的提示語','故事標題','內容'],
    '事件':['時間和地點','標題','內容']
  };
  function get(card,path){var a=path.split('.');var o=card;for(var i=0;i<a.length;i++)o=o[a[i]];return o}
  function set(card,path,v){var a=path.split('.');var o=card;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}

  function norm(t){return String(t||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n')}
  function parseFields(text, type){
    var allowed = ALLOWED[type]||[];
    var lines = norm(text).split('\n'), out=[], cur=null, pre=[];
    var re = /^(\/)?(\S+(?: \d+)?)(\s*\*|\s*\(選擇性\))?(.*)$/;
    for(var i=0;i<lines.length;i++){
      var L=lines[i], m=L.match(re), lab=m&&m[2];
      if(m){ var base=lab.replace(/\s*\d+$/,''); if(allowed.indexOf(base)<0 && allowed.indexOf(lab)<0) m=null; }
      if(m && !m[1] && !m[3] && m[4].trim()) m=null; // 沒有「/」時，標題必須獨立成行或帶 * / (選擇性)
      if(m){ if(cur) out.push(cur); cur={label:lab.replace(/^附加資訊\s*(\d)/,'附加資訊 $1'),inline:m[4].trim(),body:[]}; }
      else if(cur) cur.body.push(L); else pre.push(L);
    }
    if(cur) out.push(cur);
    return {pre:pre.join('\n').trim(), fields:out.map(function(f){
      var b=f.body.slice(); while(b.length && !b[b.length-1].trim()) b.pop();
      var body=b.join('\n');
      return {label:f.label, value: f.inline ? (f.inline + (body.trim()? '\n'+body : '')) : (body.trim()? body : '')};
    })};
  }

  function cardFromFiles(folderName, files){ // files: {basename(no .txt): text}
    var c=blankCard(folderName), st=[], ev=[];
    Object.keys(files).forEach(function(k){
      var t=files[k], m;
      if(FILES[k]){
        var parsed=parseFields(t,k);
        parsed.fields.forEach(function(f){
          var def=FILES[k].filter(function(d){return d[0]===f.label})[0];
          if(def) set(c,def[1],f.value);
          else { var xm=f.label.match(/^附加資訊 (\d+)$/); if(xm){var n=+xm[1]; if(n>=1&&n<=EXTRA_N) c.d.x[n-1]=f.value;} }
        });
      } else if((m=k.match(/^故事-(\d+)(?:-.*)?$/))){
        var pf=parseFields(t,'故事').fields, o={n:+m[1],hint:'',title:'',content:''};
        pf.forEach(function(f){ if(f.label==='解鎖故事時的提示語')o.hint=f.value; if(f.label==='故事標題')o.title=f.value; if(f.label==='內容')o.content=f.value; });
        st.push(o);
      } else if((m=k.match(/^事件-(\d+)(?:-.*)?$/))){
        var ef=parseFields(t,'事件').fields, e={n:+m[1],loc:'',title:'',content:''};
        ef.forEach(function(f){ if(f.label==='時間和地點')e.loc=f.value; if(f.label==='標題')e.title=f.value; if(f.label==='內容')e.content=f.value; });
        ev.push(e);
      } else c.unknown.push({name:k, text:norm(t)});
    });
    st.sort(function(a,b){return a.n-b.n}); ev.sort(function(a,b){return a.n-b.n});
    c.stories=st.map(function(s){return {id:uid(),hint:s.hint,title:s.title,content:s.content}});
    c.events=ev.map(function(e){return {id:uid(),loc:e.loc,title:e.title,content:e.content}});
    c.name = folderName || c.p.name || '未命名';
    if(c.unknown.length) c.draft = c.unknown.map(function(u){return '【未辨識的檔案：'+u.name+'】\n'+u.text}).join('\n\n');
    delete c.unknown;
    return c;
  }

  function blk(label,mark,style,v){
    var head=label+(mark==='*'?' *':mark==='opt'?' (選擇性)':'');
    if(style==='inline') return head+(v||'');
    return head+(v? '\n'+v : '');
  }
  function safeName(t){ return String(t||'').replace(/[\\\/:*?"<>|\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60).replace(/[. ]+$/,''); }
  function itemFile(prefix,i,title){ var t=safeName(title); return prefix+'-'+(i+1)+(t?'-'+t:''); }
  function toCRLF(s){return s.replace(/\r\n?/g,'\n').replace(/\n/g,'\r\n')}
  function serialize(card){
    var out=[];
    function file(name,parts,pre){out.push({name:name+'.txt', text:toCRLF((pre?pre+'\n\n':'')+parts.join('\n\n'))})}
    ['個人資料','基本設定'].forEach(function(k){
      file(k, FILES[k].filter(function(d){return !(d[0]==='性別' && !String(get(card,d[1])||'').trim())}).map(function(d){return blk(d[0],d[3],d[2],get(card,d[1]))}));
    });
    var det=[];
    FILES['詳細設定'].forEach(function(d){var v=get(card,d[1]); if(v&&v.trim()) det.push(blk(d[0],d[3],d[2],v))});
    card.d.x.forEach(function(v,i){ if(v&&v.trim()) det.push('附加資訊 '+(i+1)+'\n'+v) });
    if(det.length) file('詳細設定',det);
    file('首場', FILES['首場'].map(function(d){return blk(d[0],d[3],d[2],get(card,d[1]))}), '第一次聊天場景');
    card.stories.forEach(function(s,i){ file(itemFile('故事',i,s.title), ['解鎖故事時的提示語'+(s.hint?'\n'+s.hint:''), '故事標題 *'+(s.title||''), '內容 *'+(s.content?'\n'+s.content:'')]) });
    card.events.forEach(function(e,i){ file(itemFile('事件',i,e.title), ['時間和地點'+(e.loc?'\n'+e.loc:''), '標題'+(e.title?'\n'+e.title:''), '內容'+(e.content?'\n'+e.content:'')]) });
    return out;
  }

  // ---- checks ----
  function allFields(card){
    var f=[];
    function add(tab,file,label,text,anchor){f.push({tab:tab,file:file,label:label,text:text||'',anchor:anchor})}
    FILES['個人資料'].forEach(function(d){add('profile','個人資料',d[0],get(card,d[1]),d[1])});
    FILES['基本設定'].forEach(function(d){add('basic','基本設定',d[0],get(card,d[1]),d[1])});
    FILES['詳細設定'].forEach(function(d){add('detail','詳細設定',d[0],get(card,d[1]),d[1])});
    card.d.x.forEach(function(v,i){add('detail','詳細設定','附加資訊 '+(i+1),v,'d.x.'+i)});
    FILES['首場'].forEach(function(d){add('opening','首場',d[0],get(card,d[1]),d[1])});
    card.stories.forEach(function(s,i){add('stories','故事-'+(i+1),'內容',s.title+'\n'+s.content,'s.'+s.id)});
    card.events.forEach(function(e,i){add('events','事件-'+(i+1),'內容',e.content,'e.'+e.id)});
    return f;
  }
  var CATS=['rules','rules:nsfw','sceneinfo','npcinfo','worldinfo','silenttrack:on'];
  function nz(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
  function findRefs(text){
    var refs=[], re=/\(\s*\/reads\s*([^)）]*)[)）]/g, m;
    var lines=norm(text).split('\n');
    lines.forEach(function(line,li){
      re.lastIndex=0;
      while((m=re.exec(line))){
        var mode=null;
        m[1].split(/[、,，;；]/).forEach(function(tok){
          var t=tok.trim(), em=t.match(/^Events?\s*[:：]\s*(.*)$/i);
          if(em){mode='event'; t=em[1].trim();}
          if(!t) return;
          var xm=t.match(/^附加資訊\s*(\d+)(?:\s*[～~\-－至]\s*(\d+))?$/);
          if(xm){mode='extra'; var a=+xm[1], b=+(xm[2]||xm[1]); for(var k=a;k<=b;k++) refs.push({kind:'extra',n:k,raw:m[0],line:li+1}); return;}
          if(/^\d+$/.test(t) && mode==='extra'){refs.push({kind:'extra',n:+t,raw:m[0],line:li+1});return;}
          refs.push({kind:'event',name:t,raw:m[0],line:li+1});
        });
      }
    });
    return refs;
  }
  function check(card, library){
    var issues=[], fields=allFields(card);
    function push(sev,msg,where,tab,anchor){issues.push({sev:sev,msg:msg,where:where,tab:tab,anchor:anchor})}
    // required
    [['p.name','姓名','profile'],['p.age','年齡','profile'],['p.job','職業','profile'],['p.quote','來自角色的一句話','profile'],
     ['b.info','基本資訊','basic'],['b.persona','性格','basic'],['b.speech','說話風格與習慣','basic']].forEach(function(r){
      if(!String(get(card,r[0])||'').trim()) push('err','必填欄位「'+r[1]+'」是空的', r[2]==='profile'?'個人資料':'基本設定', r[2], r[0]);
    });
    card.stories.forEach(function(s,i){ if(!s.title.trim()||!s.content.trim()) push('err','故事缺少'+(!s.title.trim()?'標題':'內容'),'故事-'+(i+1),'stories','s.'+s.id) });
    card.events.forEach(function(e,i){ if(!e.title.trim()) push('warn','事件沒有標題，/reads 無法引用它','事件-'+(i+1),'events','e.'+e.id) });
    // refs
    var titles=card.events.map(function(e){return nz(e.title)}), locs=card.events.map(function(e){return nz(e.loc)});
    var usedX={}, usedE={};
    fields.forEach(function(f){
      findRefs(f.text).forEach(function(r){
        var where=f.file+' › '+f.label+' 第'+r.line+'行';
        if(r.kind==='extra'){
          usedX[r.n]=1;
          if(r.n<1||r.n>EXTRA_N) push('err','引用了不存在的「附加資訊'+r.n+'」（只有 1–10）',where,f.tab,f.anchor);
          else if(!String(card.d.x[r.n-1]||'').trim()) push('err','引用「附加資訊'+r.n+'」，但那一格是空的',where,f.tab,f.anchor);
          else if(/^#?\s*\S/.test(card.d.x[r.n-1])){
            // context hint: compare the heading before the ref with the extra's first line
            var line=norm(f.text).split('\n')[r.line-1]||'';
            var head=line.replace(/\(\s*\/reads[^)）]*[)）]/g,'').replace(/^[#\-\s]+/,'').replace(/[：:]\s*$/,'').trim();
            var first=nz(card.d.x[r.n-1].split('\n')[0]);
            if(head.length>=2 && first.length>=2 && first.indexOf(nz(head))<0 && nz(head).indexOf(first)<0){
              var better=card.d.x.map(function(v,i){return {i:i+1,f:nz(String(v).split('\n')[0])}}).filter(function(o){return o.f && (o.f.indexOf(nz(head))>=0||nz(head).indexOf(o.f)>=0)});
              if(better.length) push('warn','「'+head+'」指向附加資訊'+r.n+'（'+card.d.x[r.n-1].split('\n')[0].trim()+'），但內容看起來在附加資訊'+better.map(function(o){return o.i}).join('、'),where,f.tab,f.anchor);
            }
          }
        } else {
          var k=nz(r.name), hit=false;
          titles.forEach(function(t,i){ if(t===k || (CATS.indexOf(k)>=0 && t.indexOf(k)===0)){hit=true;usedE[i]=1} });
          locs.forEach(function(l,i){ if(l===k){hit=true;usedE[i]=1} });
          if(!hit) push('err','找不到標題為「'+r.name+'」的事件',where,f.tab,f.anchor);
        }
      });
    });
    card.d.x.forEach(function(v,i){ if(String(v).trim() && !usedX[i+1]) push('info','附加資訊'+(i+1)+'（'+String(v).split('\n')[0].trim().slice(0,20)+'）沒有被任何 /reads 引用','詳細設定','detail','d.x.'+i) });
    // leftovers from other cards
    var own=[card.name,card.p.name].map(nz);
    (library||[]).forEach(function(o){
      if(o.id===card.id) return;
      [o.name,o.p&&o.p.name].filter(function(n){return n && n.length>=2}).forEach(function(n){
        if(own.some(function(w){return w.indexOf(nz(n))>=0})) return;
        fields.forEach(function(f){
          var idx=f.text.indexOf(n); if(idx<0) return;
          var ln=f.text.slice(0,idx).split('\n').length;
          push('warn','出現其他角色的名字「'+n+'」，可能是複製時沒改到',f.file+' › '+f.label+' 第'+ln+'行',f.tab,f.anchor);
        });
      });
    });
    var seen={}; issues=issues.filter(function(i){var k=i.sev+i.msg+i.where; if(seen[k])return false; seen[k]=1; return true});
    return issues;
  }

  // ---- template from existing card ----
  function skeletonText(t){
    var lines=norm(t).split('\n'), out=[], inBar=false;
    lines.forEach(function(L){
      if(/^\s*#/.test(L) && /狀況欄/.test(L)) inBar=true;
      if(inBar){ out.push(L); if(/^\*{3}\s*$/.test(L.trim())) inBar=false; return; }
      if(/^\s*#/.test(L)){ if(out.length && out[out.length-1]!=='' ) out.push(''); out.push(L); if(!/\(\s*\/reads/.test(L)) out.push('- '); }
      else if(/\(\s*\/reads/.test(L) && /^\s*-\s*\(\s*\/reads/.test(L)) out.push(L);
    });
    return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  function fromTemplate(src, name){
    var c=blankCard(name);
    c.b.info=skeletonText(src.b.info); c.b.persona=skeletonText(src.b.persona); c.b.speech=skeletonText(src.b.speech);
    c.d.x=src.d.x.map(function(v){ var f=String(v||'').split('\n')[0].trim(); return f? f+'\n\n- ' : ''; });
    c.o.dialog=skeletonText(src.o.dialog);
    c.p.note=src.p.note;
    src.events.forEach(function(e){
      if(/^silent/i.test(e.loc.trim()) && /^rules/i.test(e.title.trim())) c.events.push({id:uid(),loc:e.loc,title:e.title,content:e.content});
    });
    return c;
  }

  return {itemFile:itemFile,blankCard:blankCard,uid:uid,parseFields:parseFields,cardFromFiles:cardFromFiles,serialize:serialize,check:check,fromTemplate:fromTemplate,findRefs:findRefs,FILES:FILES,EXTRA_N:EXTRA_N,get:get,set:set,norm:norm};
})();
if(typeof module!=='undefined') module.exports=CORE;
/* ===== END CORE ===== */
</script>

<script>
(function(){
var C=CORE, KEY='card-workshop-v1';

function skeletonCard(name){
  var c=C.blankCard(name); c.p.name=name||'';
  c.b.info='# 基本資料\n- 年齡：\n- 身高：\n- 體型：\n- 髮型：\n- 瞳色：\n- 膚色：\n- 氣息：\n- 生日：\n\n# 身份與背景\n- \n\n# 對待玩家的態度\n- \n\n# 玩家設定（隱藏資訊）\n- \n\n# 配角\n- \n\n# 世界觀與背景設定\n- ';
  c.b.persona='# 性格特徵\n- \n\n# 喜歡的東西\n- \n\n# 不喜歡的東西\n- ';
  c.b.speech='# 狀況欄\n- \n\n# 說話風格\n- \n\n# 說話習慣\n- \n\n# 行為限制\n- \n\n# 回覆規定\n- ';
  return c;
}

var S=load();
function load(){
  var s=null; try{ s=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!s||!s.cards) s={cards:[],cur:null,tab:'profile',templates:[]};
  if(!s.templates) s.templates=[];
  s.cards.forEach(function(c){ while(c.d.x.length<C.EXTRA_N) c.d.x.push(''); });
  if(!s.cur||!s.cards.some(function(c){return c.id===s.cur})) s.cur=s.cards[0]?s.cards[0].id:null;
  return s;
}
var saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ toast('無法存到瀏覽器（可能空間不足或被封鎖），請先匯出備份') } },300); }
function cur(){return S.cards.filter(function(c){return c.id===S.cur})[0]}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function h(tag,attrs,kids){var e=document.createElement(tag); if(attrs)for(var k in attrs){ if(k==='class')e.className=attrs[k]; else if(k==='text')e.textContent=attrs[k]; else if(k==='html')e.innerHTML=attrs[k]; else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]); else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]); } (kids||[]).forEach(function(c){ if(c!=null) e.appendChild(typeof c==='string'?document.createTextNode(c):c)}); return e}
var toastT; function toast(msg){ var l=document.getElementById('layer'); var old=l.querySelector('.toast'); if(old)old.remove(); var t=h('div',{class:'toast',role:'status',text:msg}); l.appendChild(t); clearTimeout(toastT); toastT=setTimeout(function(){t.remove()},2600); }
function copyText(txt,btn){
  function fallback(){ var ta=h('textarea',{style:'position:fixed;left:-9999px'}); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('已複製')}catch(e){toast('無法自動複製，請手動選取')} ta.remove(); }
  try{ navigator.clipboard.writeText(txt).then(function(){toast('已複製')},fallback) }catch(e){ fallback() }
}
function autosize(ta){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight+2, Math.max(window.innerHeight*0.75,300))+'px'; }
function armButton(btn,label,fn){ // two-step confirm
  btn.addEventListener('click',function(){
    if(btn.classList.contains('armed')){fn();return}
    var orig=btn.textContent; btn.classList.add('armed'); btn.textContent=label;
    setTimeout(function(){ if(btn.isConnected){btn.classList.remove('armed');btn.textContent=orig} },3000);
  });
}

/* ---------- sidebar ---------- */
function renderSide(){
  var ul=document.getElementById('cardList'); ul.innerHTML='';
  var sel=document.getElementById('mobileSel'); sel.innerHTML='';
  S.cards.forEach(function(c){
    var b=h('button',{type:'button','aria-current':c.id===S.cur?'true':'false',onclick:function(){S.cur=c.id;save();renderAll()}},[
      h('span',{class:'nm',text:c.name||'未命名'}),
      h('span',{class:'meta',text:'事件 '+c.events.length+' · 故事 '+c.stories.length})]);
    ul.appendChild(h('li',null,[b]));
    var o=h('option',{value:c.id,text:c.name}); if(c.id===S.cur)o.selected=true; sel.appendChild(o);
  });
  sel.onchange=function(){S.cur=sel.value;save();renderAll()};
}

/* ---------- field editor ---------- */
function fieldBox(card,path,label,mark,opts){
  opts=opts||{};
  var v=C.get(card,path)||'';
  var cnt=h('span',{class:'count',text:v.length+' 字'});
  var id='f-'+path.replace(/\./g,'-');
  var inp;
  if(opts.inline){ inp=h('input',{type:'text',id:id}); inp.value=v; }
  else { inp=h('textarea',{id:id,class:opts.big?'big':'',spellcheck:'false'}); inp.value=v; requestAnimationFrame(function(){autosize(inp)}); }
  inp.addEventListener('input',function(){ C.set(card,path,inp.value); cnt.textContent=inp.value.length+' 字'; if(!opts.inline)autosize(inp); if(path==='p.name'&&opts.onName)opts.onName(inp.value); save(); badge(); });
  var tag=h('label',{class:'tag',for:id,html:esc(label)+(mark==='*'?' <span class="req">*</span>':mark==='opt'?' <span class="opt">(選擇性)</span>':'')});
  var copy=h('button',{class:'btn ghost sm',type:'button',text:'複製',onclick:function(){copyText(inp.value)}});
  return h('div',{class:'field','data-anchor':path},[h('div',{class:'field-top'},[tag, opts.hint?h('span',{class:'hint',text:opts.hint}):null, cnt, copy]), inp]);
}

function genderBox(card){
  var v=card.b.gender||'';
  var sel=h('select',{id:'f-b-gender',class:'inp',style:'max-width:200px'});
  var opts=[['男','男'],['女','女'],['','未設置']];
  if(v && v!=='男' && v!=='女') opts.push([v,v+'（匯入的值）']);
  opts.forEach(function(o){ var op=h('option',{value:o[0],text:o[1]}); if(o[0]===v) op.selected=true; sel.appendChild(op); });
  sel.addEventListener('change',function(){ card.b.gender=sel.value; save(); badge(); });
  var tag=h('label',{class:'tag',for:'f-b-gender',text:'性別'});
  return h('div',{class:'field','data-anchor':'b.gender'},[h('div',{class:'field-top'},[tag,h('span',{class:'hint',text:'選「未設置」時不會輸出這一欄'}),h('span',{class:'count'}),copyBtn(function(){return sel.value})]), sel]);
}

function extraBox(card,i){
  var v=String(card.d.x[i]||''), nl=v.indexOf('\n');
  var tv=nl<0?v:v.slice(0,nl), cv=nl<0?'':v.slice(nl+1).replace(/^\n+/,'');
  var tid='f-d-x-'+i+'-t', cid='f-d-x-'+i;
  var ti=h('input',{type:'text',id:tid,placeholder:'標題'}); ti.value=tv;
  var ta=h('textarea',{id:cid,spellcheck:'false',placeholder:'內容'}); ta.value=cv; requestAnimationFrame(function(){autosize(ta)});
  var cnt=h('span',{class:'count'});
  function sync(){ var t=ti.value.replace(/\n/g,' '), c=ta.value; card.d.x[i]= c.trim()? t+'\n'+c : t; cnt.textContent=card.d.x[i].length+' 字'; save(); badge(); }
  cnt.textContent=v.length+' 字';
  ti.addEventListener('input',sync); ta.addEventListener('input',function(){autosize(ta);sync()});
  var sub='font-family:var(--f-mono);font-size:11.5px;color:var(--muted)';
  return h('div',{class:'field','data-anchor':'d.x.'+i},[
    h('div',{class:'field-top'},[h('span',{class:'tag',text:'附加資訊 '+(i+1)}),cnt,copyBtn(function(){return card.d.x[i]||''})]),
    h('div',{class:'field-top',style:'margin-bottom:2px'},[h('label',{for:tid,style:sub,text:'標題'}),h('span',{class:'count'}),copyBtn(function(){return ti.value})]), ti,
    h('div',{class:'field-top',style:'margin:8px 0 2px'},[h('label',{for:cid,style:sub,text:'內容'}),h('span',{class:'count'}),copyBtn(function(){return ta.value})]), ta]);
}

function copyBtn(get){ return h('button',{class:'btn ghost sm',type:'button',text:'複製',onclick:function(){copyText(get())}}); }

/* ---------- tabs ---------- */
var TABS=[['profile','個人資料'],['basic','基本設定'],['opening','首場'],['stories','故事'],['detail','詳細設定'],['events','事件'],['draft','草稿整理'],['check','檢查'],['preview','輸出預覽']];
function renderMain(){
  var m=document.getElementById('main'); m.innerHTML='';
  var card=cur();
  if(!card){ m.appendChild(h('div',{class:'empty',text:'還沒有角色。按左上「新增角色」或「匯入 zip」開始。'})); return; }
  var title=h('h2',{text:card.name});
  var nameInp=h('input',{class:'inp',type:'text',id:'cardName','aria-label':'資料夾名稱',style:'max-width:220px'}); nameInp.value=card.name;
  nameInp.addEventListener('input',function(){card.name=nameInp.value||'未命名';title.textContent=card.name;save();renderSide()});
  var exp=h('button',{class:'btn primary',type:'button',text:'匯出這張 (.zip)',onclick:function(){exportZip([card],card.name+'.zip')}});
  var dup=h('button',{class:'btn',type:'button',text:'複製一份',onclick:function(){var c=JSON.parse(JSON.stringify(card));c.id=C.uid();c.name=card.name+'（副本）';c.stories.forEach(function(s){s.id=C.uid()});c.events.forEach(function(e){e.id=C.uid()});S.cards.push(c);S.cur=c.id;save();renderAll();toast('已複製成新角色')}});
  var del=h('button',{class:'btn danger',type:'button',text:'刪除'});
  armButton(del,'再按一次刪除',function(){ S.cards=S.cards.filter(function(c){return c.id!==card.id}); S.cur=S.cards[0]?S.cards[0].id:null; save(); renderAll(); toast('已刪除'); });
  m.appendChild(h('div',{class:'head'},[
    h('div',null,[title,h('div',{class:'sub'},[h('label',{for:'cardName',text:'匯出資料夾名稱 '}),nameInp])]),
    h('div',{class:'acts'},[dup,del,exp])]));
  var tabs=h('div',{class:'tabs',role:'tablist'});
  TABS.forEach(function(t){
    var b=h('button',{type:'button',role:'tab','aria-selected':S.tab===t[0]?'true':'false',id:'tab-'+t[0],onclick:function(){S.tab=t[0];save();renderMain()}},[t[1]]);
    if(t[0]==='check') b.appendChild(h('span',{class:'badge',id:'checkBadge'}));
    tabs.appendChild(b);
  });
  m.appendChild(tabs);
  var body=h('div',{id:'tabBody'}); m.appendChild(body);
  ({profile:tProfile,basic:tBasic,detail:tDetail,opening:tOpening,stories:tStories,events:tEvents,draft:tDraft,check:tCheck,preview:tPreview})[S.tab](card,body);
  badge();
}
function badge(){
  var b=document.getElementById('checkBadge'); if(!b)return;
  var n=C.check(cur(),S.cards).filter(function(i){return i.sev==='err'}).length;
  b.textContent=n?n:'✓'; b.className='badge'+(n?'':' ok');
}
function cap(t){return h('p',{class:'file-cap',text:t})}

function tProfile(card,el){
  el.appendChild(cap('→ 個人資料.txt'));
  var F=h('div',{class:'fields'});
  var r=h('div',{class:'row2'},[fieldBox(card,'p.name','姓名','*',{inline:true}),fieldBox(card,'p.age','年齡','*',{inline:true})]);
  F.appendChild(r);
  F.appendChild(fieldBox(card,'p.job','職業','*',{inline:true}));
  F.appendChild(fieldBox(card,'p.quote','來自角色的一句話','*',{inline:true}));
  F.appendChild(fieldBox(card,'p.desc','敘述','opt',{big:true}));
  F.appendChild(fieldBox(card,'p.note','創作者筆記','opt'));
  el.appendChild(F);
}
function tBasic(card,el){
  el.appendChild(cap('→ 基本設定.txt'));
  var F=h('div',{class:'fields'});
  F.appendChild(genderBox(card));
  F.appendChild(fieldBox(card,'b.info','基本資訊','*',{big:true}));
  F.appendChild(fieldBox(card,'b.persona','性格','*',{big:true}));
  F.appendChild(fieldBox(card,'b.speech','說話風格與習慣','*',{big:true}));
  el.appendChild(F);
}
function tDetail(card,el){

/* ---------- import / export ---------- */
function decodeBytes(u8){
  var t; try{ t=new TextDecoder('utf-8',{fatal:true}).decode(u8) }catch(e){ try{ t=new TextDecoder('big5').decode(u8) }catch(e2){ t=new TextDecoder('utf-8').decode(u8) } }
  return t;
}
function fixName(s){ return s.replace(/#U([0-9a-fA-F]{4})/g,function(_,x){return String.fromCharCode(parseInt(x,16))}) }
async function readText(file){ return C.norm(decodeBytes(new Uint8Array(await file.arrayBuffer()))) }
function addTemplatesFrom(card){
  card.events.forEach(function(e){
    if(!/^silent/i.test(e.loc.trim())||!/^rules/i.test(e.title.trim())) return;
    var k=C.norm(e.content).trim();
    if(S.templates.some(function(t){return C.norm(t.content).trim()===k})) return;
    S.templates.push({id:C.uid(),loc:e.loc,title:e.title,content:e.content});
  });
}
function uniqueName(n){ var names=S.cards.map(function(c){return c.name}); if(names.indexOf(n)<0)return n; var i=2; while(names.indexOf(n+'（'+i+'）')>=0)i++; return n+'（'+i+'）'; }
async function importFiles(list){
  var groups={}, added=[];
  for(const f of list){
    if(/\.zip$/i.test(f.name)){
      if(!window.JSZip){toast('zip 元件沒有載入，請重新整理後再試');return}
      var z=await JSZip.loadAsync(f,{decodeFileName:function(b){return decodeBytes(b)}});
      var entries=[]; z.forEach(function(p,e){ if(!e.dir && /\.txt$/i.test(p) && !/__MACOSX|\/\._/.test(p)) entries.push([fixName(p),e]) });
      for(const pe of entries){ var parts=pe[0].split('/'), base=parts.pop().replace(/\.txt$/i,''), folder=parts.pop()||f.name.replace(/\.zip$/i,''); (groups[folder]=groups[folder]||{})[base]=decodeBytes(await pe[1].async('uint8array')); }
    } else if(/\.txt$/i.test(f.name)){
      var b=f.name.replace(/\.txt$/i,''); (groups['__loose']=groups['__loose']||{})[fixName(b)]=await readText(f);
    }
  }
  Object.keys(groups).forEach(function(g){
    var c=C.cardFromFiles(g==='__loose'?'':g, groups[g]);
    if(g==='__loose') c.name=c.p.name||'匯入的角色';
    c.name=uniqueName(c.name);
    addTemplatesFrom(c); S.cards.push(c); added.push(c);
  });
  if(added.length){ S.cur=added[0].id; S.tab='check'; }
  save(); renderAll();
  toast(added.length?('已匯入 '+added.length+' 張角色卡：'+added.map(function(c){return c.name}).join('、')):'沒有找到可辨識的角色卡檔案');
}
async function exportZip(cards,filename){
  if(!window.JSZip){toast('zip 元件沒有載入，請到「輸出預覽」逐檔複製');return}
  var z=new JSZip();
  cards.forEach(function(c){ C.serialize(c).forEach(function(f){ z.file('角色/'+c.name+'/'+f.name, f.text) }) });
  var blob=await z.generateAsync({type:'blob',compression:'DEFLATE'});
  var dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads') }catch(e){}
  if(!dl){ var u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u)},4000); toast('已匯出 '+filename); return; }
  try{ await dl.save({filename:filename,data:blob}); toast('已匯出 '+filename) }
  catch(e){ var c=e&&e.code; if(c==='declined')toast('已取消匯出'); else if(c==='rate_limited')toast('已有一個下載視窗開著，請先處理它'); else toast('無法匯出（'+(c||'unavailable')+'），請到「輸出預覽」逐檔複製'); }
}

  var list=h('div',{style:'display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto'});
  function draw(){ list.innerHTML=''; if(!S.templates.length)list.appendChild(h('p',{text:'沒有範本了。'}));
    S.templates.forEach(function(t,i){ var d=h('button',{class:'btn sm danger',type:'button',text:'刪除'}); armButton(d,'確定？',function(){S.templates.splice(i,1);save();draw()});
      list.appendChild(h('div',{style:'display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px'},[h('div',{style:'min-width:0'},[h('div',{class:'mono',text:t.title}),h('div',{class:'hint',text:t.content.replace(/\s+/g,' ').slice(0,40)+'…'})]),d])) }); }
  draw();
  var bg=sheet('共用範本',[h('p',{text:'匯入時會自動收集各角色的 Rules／Rules:NSFW 事件（內容相同的只留一份），新角色可以直接加入。'}),list],[h('button',{class:'btn primary',type:'button',text:'完成',onclick:function(){bg.remove();renderMain()}})]);
}

function renderAll(){ renderSide(); renderMain(); }
document.getElementById('btnNew').onclick=newCard;
document.getElementById('btnImport').onclick=function(){document.getElementById('fileImport').click()};
document.getElementById('fileImport').onchange=function(e){ var fs=Array.from(e.target.files); e.target.value=''; importFiles(fs).catch(function(err){toast('匯入失敗：'+(err&&err.message||err))}); };
document.getElementById('btnExportAll').onclick=function(){ if(!S.cards.length){toast('沒有角色可以匯出');return} exportZip(S.cards,'角色卡.zip') };
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){ if(!e.dataTransfer||!e.dataTransfer.files.length)return; if(e.target&&e.target.id==='draftText')return; e.preventDefault(); importFiles(Array.from(e.dataTransfer.files)).catch(function(err){toast('匯入失敗：'+(err&&err.message||err))}); });
renderAll();
})();
</script>
